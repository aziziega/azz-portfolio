name: Strix AI Security Audit

on:
  workflow_dispatch: # Memungkinkan eksekusi manual dari tab Actions
  pull_request:
    branches: [ "main" ] # Hanya berjalan otomatis saat PR ke branch main (menghemat token)

jobs:
  security-audit:
    runs-on: ubuntu-latest
    name: Run Strix AI Pentest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install Strix (package bernama 'strix-agent') menggunakan pip
      - name: Install Strix
        run: |
          python -m pip install --upgrade pip
          python -m pip install strix-agent
          
      - name: Run Strix Security Scan
        env:
          # Menggunakan model dari Ollama Cloud dengan prefix openai/ untuk custom provider
          STRIX_LLM: "openai/glm-5.3-flash:cloud" 
          # Tambahkan base URL layaknya config opencode
          OPENAI_API_BASE: "https://ollama.com/v1"
          # Gunakan secret yang sudah kamu siapkan, petakan ke OPENAI_API_KEY agar terbaca
          OPENAI_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
        run: |
          echo "Memulai audit keamanan berbasis AI (Strix)..."
          # Mengeksekusi via module python untuk menghindari masalah PATH (command not found)
          python -m strix.interface.main -n --target .
